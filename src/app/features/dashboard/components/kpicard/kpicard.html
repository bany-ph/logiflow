<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
  @for (card of cards();track card.title){
  <app-generic-container>
    <div class="flex items-center justify-between">
      <p class="text-slate-500 dark:text-slate-400 text-sm font-medium">{{ card.title }}</p>
      <div
        class="p-1.5 rounded-md"
        [ngClass]="{
          'bg-blue-50 dark:bg-blue-900/20 text-primary': card.logoColor === 'blue',
          'bg-indigo-50 dark:bg-indigo-900/20 text-indigo-600': card.logoColor === 'indigo',
          'bg-red-50 dark:bg-red-900/20 text-red-600': card.logoColor === 'red',
          'bg-emerald-50 dark:bg-emerald-900/20 text-emerald-600': card.logoColor === 'emerald'
        }"
      >
        <span class="material-symbols-outlined text-[20px]">{{ card.logo }}</span>
      </div>
    </div>
    

    <div class="flex items-baseline gap-2 mt-2">
      <h3 class="text-2xl font-bold text-slate-900 dark:text-white">{{ card.numberData }}</h3>
      <span
        class="text-xs font-medium px-1.5 py-0.5 rounded flex items-center gap-0.5"
        [ngClass]="
          card.trending
            ? 'text-emerald-600 bg-emerald-50 dark:bg-emerald-900/20'
            : 'text-red-600 bg-red-50 dark:bg-red-900/20'
        "
      >
        <span class="material-symbols-outlined text-[14px]">
          @if (card.trending){ trending_up } @else { trending_down }
        </span>
        {{ card.percentageData }}
      </span>
    </div>
  </app-generic-container>
  }
</div>
