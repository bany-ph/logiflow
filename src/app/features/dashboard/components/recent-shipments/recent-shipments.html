<app-generic-container>
  <div class="p-6 border-b border-slate-100 dark:border-slate-800 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
    <h3 class="text-lg font-bold text-slate-900 dark:text-white">Recent Shipments</h3>
    <div class="flex gap-2">
      <button class="cursor-pointer px-3 py-1.5 text-sm font-medium text-slate-600 dark:text-slate-300 bg-slate-100 dark:bg-slate-800 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">
        Filter
      </button>
      <button class="cursor-pointer px-3 py-1.5 text-sm font-medium text-slate-600 dark:text-slate-300 bg-slate-100 dark:bg-slate-800 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">
        Export
      </button>
    </div>
  </div>

  <div class="overflow-x-auto">
    <table class="w-full text-left border-collapse">
      <thead>
        <tr class="border-b border-slate-100 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-800/50">
          <th class="px-6 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wider">Tracking ID</th>
          <th class="px-6 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wider">Customer</th>
          <th class="px-6 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wider">Route</th>
          <th class="px-6 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wider">ETA</th>
          <th class="px-6 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wider">Status</th>
          <th class="px-6 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wider text-right">Actions</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-slate-100 dark:divide-slate-800">
        @for (shipment of shipments(); track shipment.id) {
          <tr class="hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors group">
            <td class="px-6 py-4 text-sm font-medium text-primary">{{ shipment.trackingId }}</td>
            
            <td class="px-6 py-4 text-sm text-slate-900 dark:text-slate-200">
              <div class="flex items-center gap-2">
                <div class="size-6 rounded-full bg-slate-200 bg-cover bg-center" 
                     [style.background-image]="'url(' + shipment.customerLogo + ')'">
                </div>
                {{ shipment.customerName }}
              </div>
            </td>

            <td class="px-6 py-4 text-sm text-slate-600 dark:text-slate-400">{{ shipment.route }}</td>

            <td class="px-6 py-4 text-sm text-slate-600 dark:text-slate-400">{{ shipment.eta }}</td>

            <td class="px-6 py-4">
              <app-shipment-status [status]="shipment.status"></app-shipment-status>
            </td>

            <td class="px-6 py-4 text-right">
              <button class="text-slate-400 hover:text-blue-600 transition-colors cursor-pointer">
                <span class="material-symbols-outlined text-[20px]">visibility</span>
              </button>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="6" class="px-6 py-8 text-center text-slate-500">
              No shipments found.
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>

  <div class="p-4 border-t border-slate-100 dark:border-slate-800 flex justify-center">
    <button class="cursor-pointer text-sm font-medium text-blue-600 hover:text-blue-700 dark:hover:text-blue-400 transition-colors"
    routerLink="/shipments">
      View All Shipments
    </button>
  </div>
</app-generic-container>
