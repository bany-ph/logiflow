<div class="bg-white dark:bg-[#1A2632] px-6 py-4 border-t border-slate-200 dark:border-slate-700 flex items-center justify-between">
  
  <div class="text-sm text-slate-500 dark:text-slate-400">
    Showing 
    <span class="font-medium text-slate-900 dark:text-white">{{ startItem() }}</span> 
    to 
    <span class="font-medium text-slate-900 dark:text-white">{{ endItem() }}</span> 
    of 
    <span class="font-medium text-slate-900 dark:text-white">{{ totalItems() }}</span> 
    results
  </div>

  <div class="flex gap-2">
    <button 
      (click)="onPrev()"
      [disabled]="isFirstPage()"
      class="cursor-pointer px-3 py-1 border border-slate-300 dark:border-slate-600 rounded-md text-sm font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 disabled:opacity-50 disabled:cursor-not-allowed">
      Previous
    </button>
    
    <button 
      (click)="onNext()"
      [disabled]="isLastPage()"
      class="cursor-pointer px-3 py-1 border border-slate-300 dark:border-slate-600 rounded-md text-sm font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 disabled:opacity-50 disabled:cursor-not-allowed">
      Next
    </button>
  </div>
</div>
