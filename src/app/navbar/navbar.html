<header class="h-16 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between px-6 md:px-8 z-10">
  <div class="flex items-center gap-6">
    <!-- Search Bar -->
    <div class="hidden md:flex items-center relative w-80 group/search">
      <span class="material-symbols-outlined absolute left-3 text-slate-400 group-focus-within/search:text-primary transition-colors">search</span>
      <input class="w-full h-10 pl-10 pr-4 bg-slate-100 dark:bg-slate-800 border-none rounded-lg text-sm text-slate-900 dark:text-white placeholder:text-slate-500 focus:ring-2 focus:ring-primary/50 transition-all" placeholder="Search shipments, IDs, or customers..." type="text"/>
    </div>
  </div>
  <div class="flex items-center gap-4">
    <button class="relative p-2 text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg transition-colors">
      <span class="material-symbols-outlined">notifications</span>
      <span class="absolute top-2 right-2 size-2 bg-red-500 rounded-full border border-white dark:border-slate-900"></span>
    </button>
    <div class="h-6 w-px bg-slate-200 dark:bg-slate-700 mx-1"></div>
    <button class="hidden sm:flex items-center gap-2 h-10 px-4 bg-primary hover:bg-blue-600 text-white text-sm font-semibold rounded-lg transition-colors shadow-sm shadow-primary/30">
      <span class="material-symbols-outlined text-[20px]">add</span>
      New Shipment
    </button>
    <!-- Mobile Menu Button -->
    <button class="md:hidden p-2 text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg">
      <span class="material-symbols-outlined">menu</span>
    </button>
  </div>
</header>
